{
  "name": "Publish selected alpha package",
  "on": {
    "workflow_dispatch": {}
  },
  "permissions": {
    "contents": "read"
  },
  "concurrency": {
    "group": "pages",
    "cancel-in-progress": false
  },
  "jobs": {
    "verify_and_upload": {
      "if": "github.repository == 'fourtempers-code/sgmobile-alpha' && github.ref == 'refs/heads/main'",
      "runs-on": "ubuntu-latest",
      "timeout-minutes": 10,
      "steps": [
        {
          "name": "Checkout selected package",
          "uses": "actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803",
          "with": {
            "persist-credentials": false
          }
        },
        {
          "name": "Verify exact reviewed site inventory",
          "run": "python3 verify-site.py"
        },
        {
          "name": "Configure existing Pages settings",
          "uses": "actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b",
          "with": {
            "enablement": false
          }
        },
        {
          "name": "Upload only the site directory",
          "uses": "actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b",
          "with": {
            "path": "site"
          }
        }
      ]
    },
    "deploy": {
      "needs": "verify_and_upload",
      "runs-on": "ubuntu-latest",
      "timeout-minutes": 10,
      "permissions": {
        "pages": "write",
        "id-token": "write"
      },
      "environment": {
        "name": "github-pages",
        "url": "${{ steps.deployment.outputs.page_url }}"
      },
      "steps": [
        {
          "name": "Publish selected package",
          "id": "deployment",
          "uses": "actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e"
        }
      ]
    }
  }
}
